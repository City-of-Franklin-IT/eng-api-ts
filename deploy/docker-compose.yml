services:
  eng-api-ts:
    image: ghcr.io/city-of-franklin-it/eng-api-ts:1.0.3
    restart: unless-stopped
    environment:
      - BASE_URL=${BASE_URL}

      - HOST=${HOST}
      - PORT=${PORT}

      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      - CIP_DB_HOST=${CIP_DB_HOST}
      - CIP_DB_DATABASE=${CIP_DB_DATABASE}

      - STORMWATER_DB_HOST=${STORMWATER_DB_HOST}
      - STORMWATER_DB_DATABASE=${STORMWATER_DB_DATABASE}

      - VESTING_DB_HOST=${VESTING_DB_HOST}
      - VESTING_DB_DATABASE=${VESTING_DB_DATABASE}

      - CALMING_DB_HOST=${CALMING_DB_HOST}
      - CALMING_DB_DATABASE=${CALMING_DB_DATABASE}

      - INFOR_DB_HOST=${INFOR_DB_HOST}
      - INFOR_DB_DATABASE=${INFOR_DB_DATABASE}

      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}

      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    user: "1001:1001"
    container_name: eng-api

  stormwater-mcp:
    image: ghcr.io/city-of-franklin-it/stormwater-mcp:1.0.0
    restart: unless-stopped
    environment:
      - MCP_HOST=${STORMWATER_MCP_HOST}
      - MCP_PORT=${STORMWATER_MCP_PORT}

      - MCP_API_KEY=${STORMWATER_MCP_API_KEY}

      - STORMWATER_DB_SERVER=${STORMWATER_DB_HOST}
      - STORMWATER_DB_DATABASE=${STORMWATER_DB_DATABASE}
      - STORMWATER_DB_USER=${STORMWATER_DB_USER}
      - STORMWATER_DB_PASSWORD=${STORMWATER_DB_PASSWORD}

      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}

      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
    ports:
      - "127.0.0.1:${STORMWATER_MCP_PORT}:${STORMWATER_MCP_PORT}"
    user: "1001:1001"
    container_name: stormwater-mcp

  vesting-mcp:
    image: ghcr.io/city-of-franklin-it/vesting-mcp:1.0.0
    restart: unless-stopped
    environment:
      - MCP_HOST=${VESTING_MCP_HOST}
      - MCP_PORT=${VESTING_MCP_PORT}

      - MCP_API_KEY=${VESTING_MCP_API_KEY}

      - VESTING_DB_SERVER=${VESTING_DB_HOST}
      - VESTING_DB_DATABASE=${VESTING_DB_DATABASE}
      - VESTING_DB_USER=${VESTING_DB_USER}
      - VESTING_DB_PASSWORD=${VESTING_DB_PASSWORD}

      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}

      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}

      - CIVICCLERK_BASE_URL=${CIVICCLERK_BASE_URL}

      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${VESTING_MCP_PORT}:${VESTING_MCP_PORT}"
    user: "1001:1001"
    container_name: vesting-mcp
